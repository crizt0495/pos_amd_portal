# =============================================================================
#  Build installer KasirPro Desktop — SEMUA OS sekali klik
# =============================================================================
#  Menghasilkan installer sekali klik untuk:
#    - Windows  : KasirPro-Setup-<versi>.exe         (NSIS, x64)
#    - macOS    : KasirPro-<versi>-mac-<arch>.dmg    (Intel x64 + Apple Silicon arm64)
#    - Linux    : KasirPro-<versi>-x86_64.AppImage   (jalankan langsung)
#                 KasirPro-<versi>-x86_64.deb        (instal via klik ganda)
#
#  Cara pakai:
#   1. Push tag v<versi> (mis. v1.0.1) -> workflow ini berjalan otomatis
#   2. Selesai: GitHub Release dibuat berisi installer SEMUA OS + artifact
#      (GitHub > Releases > KasirPro v<versi>)
#   3. Atau jalankan manual: tab Actions > "Build Desktop" > Run workflow
#
#  Tanpa secret pun installer sudah memakai portal produksi asli
#  (https://pos-amd.vercel.app — nilai bawaan di desktop/electron/config.js).
#  PORTAL_VERCEL_URL menjadi override opsional bila domain diganti:
#   Settings > Secrets and variables > Actions > New repository secret
#     PORTAL_VERCEL_URL  = https://domain-anda.vercel.app
# =============================================================================
name: Build Desktop (Windows, macOS, Linux)

on:
  workflow_dispatch:
    inputs:
      portal_url:
        description: 'URL portal Vercel untuk aktivasi (kosongkan = pakai secret/default)'
        required: false
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64 (NSIS)
            os: windows-latest
            args: --win --x64
            artifact: KasirPro-Setup-windows
            files: |
              desktop/release/*.exe
          - label: macOS Intel (x64)
            os: macos-14
            args: --mac --x64
            artifact: KasirPro-macOS-x64
            files: |
              desktop/release/*.dmg
              desktop/release/*.zip
          - label: macOS Apple Silicon (arm64 — cross-build)
            os: macos-14
            args: --mac --arm64
            artifact: KasirPro-macOS-arm64
            files: |
              desktop/release/*.dmg
              desktop/release/*.zip
          - label: Linux x64 (AppImage + deb)
            os: ubuntu-latest
            args: --linux
            artifact: KasirPro-Linux
            files: |
              desktop/release/*.AppImage
              desktop/release/*.deb

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Sinkronkan versi dari tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION="${GITHUB_REF##*/}"
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('desktop/package.json','utf8'));p.version='${VERSION}';fs.writeFileSync('desktop/package.json',JSON.stringify(p,null,2)+'\n')"

      - name: Tentukan URL portal (override opsional)
        id: portal
        shell: bash
        # Safety net: bila langkah ini bermasalah, build tetap jalan dengan
        # portal produksi bawaan (https://pos-amd.vercel.app di config.js).
        continue-on-error: true
        run: |
          URL="${{ github.event.inputs.portal_url }}"
          if [ -z "$URL" ]; then
            URL="${{ secrets.PORTAL_VERCEL_URL }}"
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          if [ -n "$URL" ]; then
            echo "Portal URL untuk build: $URL"
          else
            echo "Tanpa override - memakai portal produksi bawaan (pos-amd.vercel.app)"
          fi

      - name: Install dependencies
        working-directory: desktop
        run: npm ci

      - name: Tulis konfigurasi build (domain portal)
        if: steps.portal.outputs.url != ''
        working-directory: desktop
        run: npm run set-portal -- ${{ steps.portal.outputs.url }}

      - name: Typecheck
        working-directory: desktop
        run: npm run typecheck

      - name: Rakit installer ${{ matrix.label }}
        working-directory: desktop
        run: npm run build && npx electron-builder ${{ matrix.args }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Unggah artifact ${{ matrix.artifact }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publikasikan GitHub Release (saat push tag v*)
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Unduh semua installer
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts
          merge-multiple: true

      - name: Buat Release berisi installer semua OS
        uses: softprops/action-gh-release@v2
        with:
          files: dist-artifacts/**
          generate_release_notes: true