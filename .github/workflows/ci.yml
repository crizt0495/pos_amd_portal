# =============================================================================
#  CI — typecheck + uji otomatis (Linux, tanpa butuh Supabase)
# =============================================================================
#  Jalankan otomatis setiap push, dan bisa dipicu manual dari tab Actions.
#  Uji yang butuh Supabase hanya dilaporkan sebagai catatan, bukan
#  menggagalkan build (lihat "Status verifikasi" di README).
# =============================================================================
name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck + uji
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install portal
        run: npm --prefix ./portal install

      - name: Typecheck portal
        run: npm --prefix ./portal run typecheck

      - name: Build portal
        run: npm --prefix ./portal run build

      - name: Uji statis
        run: node tools/test/run-all.mjs statis

      - name: Uji portal (tsc + build + route API + cek Supabase)
        run: node tools/test/run-all.mjs portal